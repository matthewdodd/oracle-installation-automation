---
name: Molecule

# End-to-end test of the playbook in RHEL-compatible containers with stub Oracle software
# (molecule/default/; resolution plan step 25). Runs on every pull request, with no paths filter: the
# "molecule" check is required by main's branch protection, so it must report on every PR, including
# docs-only ones (a run takes about 4-5 minutes). Also runs on push to main, so main's own status is
# visible after each merge, and on demand.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: molecule-${{ github.ref }}
  cancel-in-progress: true

jobs:
  molecule:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install test tooling
        run: pip install -r requirements-test.txt

      - name: shellcheck the test stubs
        run: shellcheck molecule/default/files/*.bash molecule/default/files/stubs/*

      - name: molecule test
        run: molecule test --scenario-name default
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
