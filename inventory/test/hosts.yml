---
# test environment inventory (skeleton). Rename the directory to match your environment name;
# see inventory/README.md. No hosts are listed yet: add the test database servers below.
#
# Hosts passed with `-e target=host1,host2` that are NOT listed here are added at run time, but only
# get group_vars/oracle_db_servers/ when you also pass `-e ansible_inventory_groups=oracle_db_servers`.
# Without it they have no environment configuration and the input validation fails.
all:
  children:
    oracle_db_servers:
      hosts: {}
      # Replace the line above with the host list, e.g.:
      # hosts:
      #   dbhost01.example.invalid:
      #   dbhost02.example.invalid:
