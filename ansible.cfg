[defaults]
# No default inventory on purpose: pass one explicitly, e.g.
#   ansible-playbook -i inventory/<env>/hosts.yml oracle_database_install.yml -e target=...
# See inventory/example/ for the expected layout.

# SSH host keys are verified (secure default). Manage known_hosts before the first run:
#   - controller / CI: populate ~/.ssh/known_hosts (or a file named with
#     ansible_ssh_common_args='-o UserKnownHostsFile=/path/known_hosts') from a trusted source,
#     e.g. ssh-keyscan <host> and compare the fingerprint with the one from the host console or
#     your provisioning system (cloud-init output, CMDB) before trusting it;
#   - AAP: keep known_hosts in the execution environment image or a mounted file and leave
#     host key checking on in the job settings.
# Disable it only knowingly and temporarily (e.g. to bootstrap a new host) with the environment
# variable ANSIBLE_HOST_KEY_CHECKING=False, never by changing this file.
host_key_checking = True

# auto_legacy* values were removed from ansible-core; on 2.22 they are treated as a literal
# interpreter path and every module fails. Override per host group with ansible_python_interpreter.
interpreter_python = auto_silent

# YAML-formatted task output. The community.general 'yaml' callback was removed in
# community.general 12.0.0; the builtin default callback provides the same output.
stdout_callback = ansible.builtin.default
callback_result_format = yaml

# The remote (connection) user is defined in the inventory (ansible_user).

# Roles of this repository, also for playbooks outside the repository root (tests/).
roles_path = ./roles

# allow_world_readable_tmpfiles is deliberately NOT set: it makes module files (which can hold
# arguments and secrets) readable by every local user. The playbook becomes unprivileged users
# (db_owner) from the connection user; supported ways to make that work, pick one per inventory:
#   1. POSIX ACLs (RHEL/Linux): install the 'acl' package (setfacl) on the targets. Ansible uses it
#      automatically; nothing else to configure.
#   2. A shared group (AIX, or Linux without setfacl): set ansible_common_remote_group to a group
#      that both the connection user and db_owner belong to, e.g. oracle_common_group_name
#      (the group this playbook adds db_owner and b_user to). See inventory/example/.
#   3. Connect as root (ansible_user: root, with or without b_user: root), e.g. on cloud hosts
#      without the root-wrapper. Ansible, running as root, hands each temp file to db_owner, and the
#      task-level become_user: db_owner stays in effect (runInstaller and OPatch refuse to run as
#      root). Do NOT set ansible_become_user: it is a connection variable that overrides the
#      become_user of every task, so the Oracle home, staging, runInstaller and OPatch would run
#      as that user (root) and fail.
# Pipelining (below) already avoids temp files for most modules; file-transfer modules
# (copy, template, unarchive) still need one of the above.
# Only if none of these is possible, enable world-readable temp files knowingly, for the affected
# hosts only, in the inventory (ansible_shell_allow_world_readable_temp: true), never here.

[ssh_connection]
pipelining = True
