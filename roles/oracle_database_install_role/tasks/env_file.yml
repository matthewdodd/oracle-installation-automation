---
# Environment file <oracle_common_env_dir>/<DATABASE_NAME>.env, rendered from templates/db_install.env.j2
# (replaces the original cp + prepend through a shared temp file). tasks/preflight.yml has already
# refused a different existing file unless oracle_database_install_role_force_env_file is true. Such a forced
# overwrite first keeps a timestamped backup next to the file (<DB>.env.<pid>.<date>~, owner, group and mode
# preserved) while oracle_database_install_role_env_file_backup is true (default). No backup is made when the
# content is unchanged, when the file is new, or in check mode. Rollback never removes the backup.

- name: Write the environment file {{ oracle_common_env_file }}
  become: true
  become_user: "{{ oracle_common_privileged_user }}"
  ansible.builtin.template:
    src: db_install.env.j2
    dest: "{{ oracle_common_env_file }}"
    mode: "{{ oracle_database_install_role_modes.env_file_mode }}"
    backup: "{{ oracle_database_install_role_env_file_backup | bool }}"
  register: oracle_database_install_role_env_file_result

- name: Show the backup of the replaced environment file
  when:
    - oracle_database_install_role_safety.env_file_exists | bool
    - oracle_database_install_role_env_file_result is changed
  # Four outcomes: a backup was made (its path), check mode, backups disabled, or backups enabled but none
  # needed because the content was unchanged (the task changed only attributes such as the mode).
  vars:
    __oracle_database_install_role_env_backup_path: "{{ oracle_database_install_role_env_file_result.backup_file | default('') }}"
  ansible.builtin.debug:
    msg: >-
      {{ ('Previous ' ~ oracle_common_env_file ~ ' saved as ' ~ __oracle_database_install_role_env_backup_path)
         if __oracle_database_install_role_env_backup_path | length > 0
         else ('No backup of ' ~ oracle_common_env_file ~ ' made: '
               ~ ('check mode' if ansible_check_mode
                  else ('not needed, content unchanged (only attributes such as the mode were corrected)'
                        if oracle_database_install_role_env_file_backup | bool
                        else 'oracle_database_install_role_env_file_backup is false'))) }}

- name: Record that this run created the environment file
  when: not (oracle_database_install_role_safety.env_file_exists | bool)
  ansible.builtin.set_fact:
    oracle_database_install_role_created: "{{ oracle_database_install_role_created | combine({'env_file': true}) }}"

- name: Read {{ oracle_common_env_file }}
  become: true
  become_user: "{{ oracle_common_privileged_user }}"
  ansible.builtin.slurp:
    src: "{{ oracle_common_env_file }}"
  register: oracle_database_install_role_env_final

- name: Show {{ oracle_common_env_file }}
  ansible.builtin.debug:
    msg: "{{ (oracle_database_install_role_env_final.content | b64decode).splitlines() }}"
