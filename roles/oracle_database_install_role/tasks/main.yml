---
# tasks file for Oracle Database Installation
# Inputs and derived paths are defined in ../defaults/main.yml and roles/oracle_common.
# Requires roles/oracle_common to have run first (OS variables + input validation).

# Production-host safety: refuse an existing non-empty ORACLE_HOME or a different environment file
# (unless forced) and work out the central inventory to reuse or create. Read-only.
- name: Check the host is safe to install on
  ansible.builtin.include_tasks: preflight.yml

# Copied as db_owner: on main the effective copy was the db_owner one in initialization_role
# (the later connection-user copy was a no-op), so the staged scripts stay owned by db_owner.
- name: Copy Scripts to {{ remote_script_directory }}
  become: true
  become_user: "{{ db_owner }}"
  block:
    - name: Copy role scripts to {{ remote_script_directory }}/oracle_database_install_role
      ansible.builtin.copy:
        src: "{{ role_path }}/files/"
        dest: "{{ remote_script_directory }}/oracle_database_install_role"
        mode: "{{ oracle_common_modes.script_permission }}"
        directory_mode: "{{ oracle_common_modes.oracle_common_staging_dir_mode }}"

- name: Oracle Database Installation
  become: true
  become_user: "{{ db_owner }}"
  block:
    - name: Create the Oracle Home location
      ansible.builtin.file:
        path: "{{ oracle_home }}"
        mode: "{{ oracle_database_install_role_modes.home_mode }}"
        state: directory

    # Recorded before any extraction so the install rescue (tasks/rollback.yml) removes only a home this
    # run created, or empties one that was an empty directory before; a non-empty home is never removed.
    - name: Record whether this run owns the Oracle Home content
      ansible.builtin.set_fact:
        oracle_database_install_role_created: >-
          {{ oracle_database_install_role_created | combine({
               'home': oracle_database_install_role_safety.home_state == 'absent',
               'home_contents': oracle_database_install_role_safety.home_state == 'empty'}) }}

    - name: Download and copy binaries to server
      ansible.builtin.include_tasks: copy_files_to_server.yml
      vars:
        artf_file_name: "{{ install_file_name }}"
        temp_dir: "{{ install_folder_name }}"
        patch: "no"
    
    - name: Move the Binary file to the installation location
      copy:
        src: "{{ install_folder_name }}/{{ install_file_name }}"
        dest: "{{ oracle_home }}"
        remote_src: true
        mode: "{{ oracle_database_install_role_modes.download_file_mode }}"

    - name: Extract {{ install_file_name }} into {{ oracle_home }}
      ansible.builtin.unarchive:
        remote_src: true
        src: "{{ oracle_home }}/{{ install_file_name }}"
        dest: "{{ oracle_home }}"

    - name: Remove "{{ oracle_home }}/{{ install_file_name }}"
      file:
        state: absent
        path: "{{ oracle_home }}/{{ install_file_name }}"
      ignore_errors: true

    - name: Correct Permissions on the Oracle Home location
      ansible.builtin.file:
        path: "{{ oracle_home }}"
        mode: "{{ oracle_database_install_role_modes.home_mode }}"
        state: directory

    # The prerequisite package check (per-OS list, fails on missing packages unless oracle_ignore_prereqs)
    # runs read-only in tasks/preflight.yml (tasks/prereqs.yml), before anything changes on the host.

    # Reuses an existing oraInst.loc (side-by-side) or creates it on a clean target; never rewrites it.
    - name: Set up the central inventory
      ansible.builtin.include_tasks: inventory.yml

    - name: Set up {{ oracle_common_env_file }}
      ansible.builtin.include_tasks: env_file.yml

    - name: Run the rootpre.sh (AIX)
      ansible.builtin.include_tasks: rootpre.yml
      when:
        - oracle_common_run_rootpre | bool

    # Argument vector, no shell: every value reaches the script as one literal argument.
    - name: Install Database Binaries for {{ db_owner }}
      ansible.builtin.command:
        argv:
          - "{{ oracle_common_bash_path }}"
          - "{{ remote_script_directory }}/oracle_database_install_role/database_install.bash"
          - "{{ DATABASE_NAME }}"
          - "{{ db_owner }}"
          - "{{ remote_script_directory }}"
          - "{{ remote_output_directory }}"
          - "{{ database_version }}"
          - "{{ oracle_common_env_file }}"
      # Inputs of database_install.bash (documented at the top of the script). Empty values keep the
      # script's defaults (primary group of db_owner, <ORACLE_HOME>/responseFile.rsp, no extra keys).
      environment:
        # Effective central inventory (existing or newly created) for INVENTORY_LOCATION in the response file.
        ORACLE_INVENTORY_LOCATION: "{{ oracle_database_install_role_safety.inventory_location }}"
        # -ignorePrereq only when oracle_ignore_prereqs is true (default false).
        ORACLE_IGNORE_PREREQS: "{{ 'true' if (oracle_database_install_role_ignore_prereqs | bool) else 'false' }}"
        ORACLE_INSTALL_EDITION: "{{ oracle_database_install_role_install_edition }}"
        ORACLE_INSTALL_OPTION: "{{ oracle_database_install_role_install_option }}"
        ORACLE_OS_GROUP: "{{ oracle_database_install_role_os_group }}"
        ORACLE_RESPONSE_FILE: "{{ oracle_database_install_role_response_file }}"
        ORACLE_RESPONSE_EXTRA_FILE: "{{ oracle_database_install_role_response_extra_file }}"
      async: 4000
      poll: 0
      register: shell_output

    - name: "Check on an async task: Install Database Binaries for {{ db_owner }}"
      async_status:
        jid: "{{ shell_output.ansible_job_id }}"
      register: job_result
      until: job_result.finished
      retries: 120
      delay: 30

    - debug:
        var: job_result.stdout_lines
      failed_when: job_result.rc != 0

    # root.sh through the site root wrapper (default) or directly through become; fails unless it succeeded.
    - name: Run root.sh in {{ oracle_home }}
      ansible.builtin.include_tasks: root_script.yml
      vars:
        __oracle_database_install_role_root_script_dir: "{{ oracle_home }}"
        __oracle_database_install_role_root_script_name: root.sh
        __oracle_database_install_role_root_script_success_regex: "{{ oracle_common_root_sh_success_regex }}"

    - name: Download and copy patches to server
      ansible.builtin.include_tasks: copy_files_to_server.yml
      vars:
        artf_file_name: "{{ patch_file_name }}"
        temp_dir: "{{ install_folder_name }}"
        patch: "yes"

    - name: Patch Database Binaries for {{ db_owner }}
      ansible.builtin.command:
        argv:
          - "{{ oracle_common_bash_path }}"
          - "{{ remote_script_directory }}/oracle_database_install_role/database_patch.bash"
          - "{{ DATABASE_NAME }}"
          - "{{ db_owner }}"
          - "{{ remote_script_directory }}"
          - "{{ remote_output_directory }}"
          - "{{ install_folder_name }}"
          - "{{ oracle_common_env_file }}"
      async: 4000
      poll: 0
      register: shell_output

    - name: "Check on an async task: Patch Database Binaries for {{ db_owner }}"
      async_status:
        jid: "{{ shell_output.ansible_job_id }}"
      register: job_result
      until: job_result.finished
      retries: 120
      delay: 30
      
    - debug:
        var: job_result.stdout_lines
      failed_when: job_result.rc != 0