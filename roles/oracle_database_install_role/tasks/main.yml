---
# tasks file for Oracle Database Installation
# Inputs and derived paths are defined in ../defaults/main.yml and roles/oracle_common.
# Requires roles/oracle_common to have run first (OS variables + input validation).

# Copied as db_owner: on main the effective copy was the db_owner one in initialization_role
# (the later connection-user copy was a no-op), so the staged scripts stay owned by db_owner.
- name: Copy Scripts to {{ remote_script_directory }}
  become: true
  become_user: "{{ db_owner }}"
  block:
    - name: Copy role scripts to {{ remote_script_directory }}/oracle_database_install_role
      ansible.builtin.copy:
        src: "{{ role_path }}/files/"
        dest: "{{ remote_script_directory }}/oracle_database_install_role"
        mode: "{{ script_permission }}"

- name: Oracle Database Installation
  become: yes
  become_user: "{{ db_owner }}"
  block:
    - name: Create the Oracle Home location
      file:
        path: "{{ oracle_home }}"
        mode: "{{ script_permission }}"
        state: directory

    - name: Download and copy binaries to server
      ansible.builtin.include_tasks: copy_files_to_server.yml
      vars:
        artf_file_name: "{{ install_file_name }}"
        temp_dir: "{{ install_folder_name }}"
        patch: "no"
    
    - name: Move the Binary file to the installation location
      copy:
        src: "{{ install_folder_name }}/{{ install_file_name }}"
        dest: "{{ oracle_home }}"
        remote_src: yes

    - name: Extract {{ install_file_name }} into {{ oracle_home }}
      ansible.builtin.unarchive:
        remote_src: yes
        src: "{{ oracle_home }}/{{ install_file_name }}"
        dest: "{{ oracle_home }}"

    - name: Remove "{{ oracle_home }}/{{ install_file_name }}"
      file:
        state: absent
        path: "{{ oracle_home }}/{{ install_file_name }}"
      ignore_errors: true

    - name: Correct Permissions on the Oracle Home location
      file:
        path: "{{ oracle_home }}"
        mode: '0755'
        state: directory

    - name: Check whether pre-requisite packages are installed
      block:
        - set_fact:
            missing_packages: []

        - name: Gather the package facts
          ansible.builtin.package_facts:
            manager: "{{ oracle_common_package_manager }}"

        - name: Check whether pre-requisite packages are installed
          set_fact:
            missing_packages: "{{ missing_packages + [ item ] }}"
          when: 
            - item not in ansible_facts.packages
          with_items: "{{ oracle_common_prereq_packages }}"
      # Per-OS package lists live in roles/oracle_common/vars/<os>.yml (RedHat.yml today).
      when:
        - oracle_common_prereq_packages | length > 0

    - name: Set up /etc/oraInst.loc
      become: yes
      become_user: "{{ b_user }}"
      shell: |
        > /etc/oraInst.loc
        instgrp=$(id -g -n {{ db_owner }})
        echo "inst_group=$instgrp" >> /etc/oraInst.loc
        echo "inventory_loc={{ mountpoint }}/{{ db_owner }}/oraInventory" >> /etc/oraInst.loc
        cat /etc/oraInst.loc

    - name: Set up {{ oracle_common_env_file }}
      become: yes
      become_user: "{{ b_user }}"
      shell: |     
        cp {{ remote_script_directory }}/oracle_database_install_role/db_install.env {{ oracle_common_env_file }}

        chmod 0755 {{ oracle_common_env_file }}

        echo 'ORACLE_HOME=$ORACLE_BASE/product/{{ database_version }}; export ORACLE_HOME' | cat - {{ oracle_common_env_file }} > {{ oracle_common_env_file }}.tmp && mv {{ oracle_common_env_file }}.tmp {{ oracle_common_env_file }}
        echo 'ORACLE_BASE={{ mountpoint }}/{{ db_owner }}; export ORACLE_BASE' | cat - {{ oracle_common_env_file }} > {{ oracle_common_env_file }}.tmp && mv {{ oracle_common_env_file }}.tmp {{ oracle_common_env_file }}
        echo 'ORACLE_SID={{ DATABASE_NAME }}; export ORACLE_SID' | cat - {{ oracle_common_env_file }} > {{ oracle_common_env_file }}.tmp && mv {{ oracle_common_env_file }}.tmp {{ oracle_common_env_file }}
        echo 'ORACLE_HOSTNAME=$(hostname); export ORACLE_HOSTNAME' | cat - {{ oracle_common_env_file }} > {{ oracle_common_env_file }}.tmp && mv {{ oracle_common_env_file }}.tmp {{ oracle_common_env_file }}
        echo '#' | cat - {{ oracle_common_env_file }} > {{ oracle_common_env_file }}.tmp && mv {{ oracle_common_env_file }}.tmp {{ oracle_common_env_file }}

        cat {{ oracle_common_env_file }}
    
    - name: Run the rootpre.sh (AIX)
      ansible.builtin.include_tasks: rootpre.yml
      when:
        - oracle_common_run_rootpre | bool
    
    - name: Install Database Binaries for {{ db_owner }}
      shell: |
        {{ remote_script_directory }}/oracle_database_install_role/database_install.bash {{ DATABASE_NAME }} {{ db_owner }} {{ remote_script_directory }} {{ remote_output_directory }} {{ database_version }} {{ oracle_common_env_file }}
      async: 4000
      poll: 0
      register: shell_output

    - name: "Check on an async task: Install Database Binaries for {{ db_owner }}"
      async_status:
        jid: "{{ shell_output.ansible_job_id }}"
      register: job_result
      until: job_result.finished
      retries: 120
      delay: 30

    - debug:
        var: job_result.stdout_lines
      failed_when: job_result.rc != 0

    - name: Run the root.sh script
      become: yes
      become_user: "{{ b_user }}"
      shell: |
        set timeout {{ oracle_common_root_wrapper_timeout | int }}
        spawn {{ oracle_common_root_wrapper_path }}

        expect "*Enter your Selection*"
        
        send "1\r"

        expect "*Enter your Selection*"

        send "1\r"

        expect "*Enter the PATH to root.sh*"

        send "{{ oracle_home }}\r"

        expect "*Press ENTER to continue...*"

        send "\r"

        expect "*Enter your Selection*"

        send "x\r"

        exit 0
      args:
        executable: "{{ oracle_common_expect_path }}"
      register: root_output

    - debug:
        msg: "{{ root_output }}"

    - name: Download and copy patches to server
      ansible.builtin.include_tasks: copy_files_to_server.yml
      vars:
        artf_file_name: "{{ patch_file_name }}"
        temp_dir: "{{ install_folder_name }}"
        patch: "yes"

    - name: Patch Database Binaries for {{ db_owner }}
      shell: |
        {{ remote_script_directory }}/oracle_database_install_role/database_patch.bash {{ DATABASE_NAME }} {{ db_owner }} {{ remote_script_directory }} {{ remote_output_directory }} {{ install_folder_name }} {{ oracle_common_env_file }}
      async: 4000
      poll: 0
      register: shell_output

    - name: "Check on an async task: Patch Database Binaries for {{ db_owner }}"
      async_status:
        jid: "{{ shell_output.ansible_job_id }}"
      register: job_result
      until: job_result.finished
      retries: 120
      delay: 30
      
    - debug:
        var: job_result.stdout_lines
      failed_when: job_result.rc != 0