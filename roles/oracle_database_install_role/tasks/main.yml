---
# tasks file for Oracle Database Installation
# Inputs and derived paths are defined in ../defaults/main.yml and roles/oracle_common.
# Requires roles/oracle_common to have run first (OS variables + input validation).

# Production-host safety: refuse an existing non-empty ORACLE_HOME or a different environment file
# (unless forced) and work out the central inventory to reuse or create. Read-only.
- name: Check the host is safe to install on
  ansible.builtin.include_tasks: preflight.yml

# Copied as db_owner: on main the effective copy was the db_owner one in initialization_role
# (the later connection-user copy was a no-op), so the staged scripts stay owned by db_owner.
- name: Copy the role scripts to the staging directory
  become: true
  become_user: "{{ db_owner }}"
  ansible.builtin.copy:
    src: "{{ role_path }}/files/"
    dest: "{{ oracle_common_remote_script_directory }}/oracle_database_install_role"
    mode: "{{ oracle_common_modes.script_permission }}"
    directory_mode: "{{ oracle_common_modes.oracle_common_staging_dir_mode }}"

# Check mode stops here: every later step needs the downloaded artifacts, which check mode does not fetch.
# The checks above (inputs, host safety, prerequisites, staging) have all run.
- name: Report what check mode skips
  when: ansible_check_mode
  ansible.builtin.debug:
    msg: >-
      Check mode: download, extraction into {{ oracle_database_install_role_oracle_home }}, central inventory,
      environment file, root scripts, installer and patch run are skipped (they need the downloaded artifacts).

- name: Oracle Database Installation
  when: not ansible_check_mode
  become: true
  become_user: "{{ db_owner }}"
  block:
    - name: Create the Oracle Home location
      ansible.builtin.file:
        path: "{{ oracle_database_install_role_oracle_home }}"
        mode: "{{ oracle_database_install_role_modes.home_mode }}"
        state: directory

    # Recorded before any extraction so the install rescue (tasks/rollback.yml) removes only a home this
    # run created, or empties one that was an empty directory before; a non-empty home is never removed.
    - name: Record whether this run owns the Oracle Home content
      ansible.builtin.set_fact:
        oracle_database_install_role_created: >-
          {{ oracle_database_install_role_created | combine({
               'home': oracle_database_install_role_safety.home_state == 'absent',
               'home_contents': oracle_database_install_role_safety.home_state == 'empty'}) }}

    - name: Download the binaries
      ansible.builtin.include_tasks: copy_files_to_server.yml
      vars:
        __oracle_database_install_role_artifact: "{{ oracle_database_install_role_install_file_name }}"
        __oracle_database_install_role_download_dir: "{{ oracle_database_install_role_install_folder_name }}"
        __oracle_database_install_role_extract: false

    # Extracted straight from the staging directory. The original first copied the archive into the
    # ORACLE_HOME, extracted it there and then deleted the copy; the resulting home is the same.
    - name: Extract the binaries into the Oracle Home
      ansible.builtin.unarchive:
        remote_src: true
        src: "{{ oracle_database_install_role_install_folder_name }}/{{ oracle_database_install_role_install_file_name }}"
        dest: "{{ oracle_database_install_role_oracle_home }}"

    - name: Correct Permissions on the Oracle Home location
      ansible.builtin.file:
        path: "{{ oracle_database_install_role_oracle_home }}"
        mode: "{{ oracle_database_install_role_modes.home_mode }}"
        state: directory

    # The prerequisite package check (per-OS list, fails on missing packages unless oracle_ignore_prereqs)
    # runs read-only in tasks/preflight.yml (tasks/prereqs.yml), before anything changes on the host.

    # Reuses an existing oraInst.loc (side-by-side) or creates it on a clean target; never rewrites it.
    - name: Set up the central inventory
      ansible.builtin.include_tasks: inventory.yml

    - name: Set up the environment file
      ansible.builtin.include_tasks: env_file.yml

    - name: Run the rootpre.sh (AIX)
      ansible.builtin.include_tasks: rootpre.yml
      when:
        - oracle_common_run_rootpre | bool

    # Argument vector, no shell: every value reaches the script as one literal argument. It runs in the
    # background for at most oracle_database_install_role_install_timeout seconds.
    - name: Install Database Binaries for {{ db_owner }}
      ansible.builtin.command:
        argv:
          - "{{ oracle_common_bash_path }}"
          - "{{ oracle_common_remote_script_directory }}/oracle_database_install_role/database_install.bash"
          - "{{ DATABASE_NAME }}"
          - "{{ db_owner }}"
          - "{{ oracle_common_remote_script_directory }}"
          - "{{ oracle_common_remote_output_directory }}"
          - "{{ database_version }}"
          - "{{ oracle_common_env_file }}"
      # Inputs of database_install.bash (documented at the top of the script). Empty values keep the
      # script's defaults (primary group of db_owner, <ORACLE_HOME>/responseFile.rsp, no extra keys).
      environment:
        # Effective central inventory (existing or newly created) for INVENTORY_LOCATION in the response file.
        ORACLE_INVENTORY_LOCATION: "{{ oracle_database_install_role_safety.inventory_location }}"
        # -ignorePrereq only when oracle_ignore_prereqs is true (default false).
        ORACLE_IGNORE_PREREQS: "{{ 'true' if (oracle_database_install_role_ignore_prereqs | bool) else 'false' }}"
        ORACLE_INSTALL_EDITION: "{{ oracle_database_install_role_install_edition }}"
        ORACLE_INSTALL_OPTION: "{{ oracle_database_install_role_install_option }}"
        ORACLE_OS_GROUP: "{{ oracle_database_install_role_os_group }}"
        ORACLE_RESPONSE_FILE: "{{ oracle_database_install_role_response_file }}"
        ORACLE_RESPONSE_EXTRA_FILE: "{{ oracle_database_install_role_response_extra_file }}"
      async: "{{ oracle_database_install_role_install_timeout | int }}"
      poll: 0
      register: oracle_database_install_role_install_job
      changed_when: true

    # The job's own failure is reported by the check below (after the output is shown); only running past
    # the poll window fails this task. The window covers the whole async limit plus one interval.
    - name: Wait for the installer to finish
      ansible.builtin.async_status:
        jid: "{{ oracle_database_install_role_install_job.ansible_job_id }}"
      register: oracle_database_install_role_install_result
      until: oracle_database_install_role_install_result.finished | bool
      retries: "{{ __oracle_database_install_role_install_retries }}"
      delay: "{{ oracle_database_install_role_poll_interval | int }}"
      failed_when: false
      changed_when: false
      vars:
        __oracle_database_install_role_install_retries: >-
          {{ ((oracle_database_install_role_install_timeout | int) / (oracle_database_install_role_poll_interval | int))
             | round(0, 'ceil') | int + 1 }}

    - name: Check the installer result
      ansible.builtin.include_tasks: script_result.yml
      vars:
        __oracle_database_install_role_script_label: database_install.bash (runInstaller)
        __oracle_database_install_role_script_result: "{{ oracle_database_install_role_install_result }}"
        __oracle_database_install_role_script_status_file: "{{ oracle_common_remote_output_directory }}/install_status.txt"

    # root.sh through the site root wrapper (default) or directly through become; fails unless it succeeded.
    - name: Run root.sh in the Oracle Home
      ansible.builtin.include_tasks: root_script.yml
      vars:
        __oracle_database_install_role_root_script_dir: "{{ oracle_database_install_role_oracle_home }}"
        __oracle_database_install_role_root_script_name: root.sh
        __oracle_database_install_role_root_script_success_regex: "{{ oracle_common_root_sh_success_regex }}"

    - name: Download and extract the patches
      ansible.builtin.include_tasks: copy_files_to_server.yml
      vars:
        __oracle_database_install_role_artifact: "{{ oracle_database_install_role_patch_file_name }}"
        __oracle_database_install_role_download_dir: "{{ oracle_database_install_role_install_folder_name }}"
        __oracle_database_install_role_extract: true

    - name: Patch Database Binaries for {{ db_owner }}
      ansible.builtin.command:
        argv:
          - "{{ oracle_common_bash_path }}"
          - "{{ oracle_common_remote_script_directory }}/oracle_database_install_role/database_patch.bash"
          - "{{ DATABASE_NAME }}"
          - "{{ db_owner }}"
          - "{{ oracle_common_remote_script_directory }}"
          - "{{ oracle_common_remote_output_directory }}"
          - "{{ oracle_database_install_role_install_folder_name }}"
          - "{{ oracle_common_env_file }}"
      async: "{{ oracle_database_install_role_patch_timeout | int }}"
      poll: 0
      register: oracle_database_install_role_patch_job
      changed_when: true

    - name: Wait for the patch run to finish
      ansible.builtin.async_status:
        jid: "{{ oracle_database_install_role_patch_job.ansible_job_id }}"
      register: oracle_database_install_role_patch_result
      until: oracle_database_install_role_patch_result.finished | bool
      retries: "{{ __oracle_database_install_role_patch_retries }}"
      delay: "{{ oracle_database_install_role_poll_interval | int }}"
      failed_when: false
      changed_when: false
      vars:
        __oracle_database_install_role_patch_retries: >-
          {{ ((oracle_database_install_role_patch_timeout | int) / (oracle_database_install_role_poll_interval | int))
             | round(0, 'ceil') | int + 1 }}

    - name: Check the patch result
      ansible.builtin.include_tasks: script_result.yml
      vars:
        __oracle_database_install_role_script_label: database_patch.bash (OPatch)
        __oracle_database_install_role_script_result: "{{ oracle_database_install_role_patch_result }}"
        __oracle_database_install_role_script_status_file: >-
          {{ oracle_common_remote_output_directory }}/opatch_status.txt, {{ oracle_common_remote_output_directory }}/opatch_jvm_status.txt
