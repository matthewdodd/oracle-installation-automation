---
- name: Initialize the rootpre.sh script
  become: true
  become_user: "{{ db_owner }}"
  block:
    - set_fact:
        root_pre_folder: "{{ oracle_home }}/clone"
    
    - name: Copy rootpre.sh to {{ root_pre_folder }}/root.sh
      copy:
        src: "{{ root_pre_folder }}/rootpre.sh"
        dest: "{{ root_pre_folder }}/root.sh"
        remote_src: true
        mode: '0755'
   
# Static expect script: values come from the environment ($env(...)), never from Jinja in the script.
- name: Run the rootpre.sh script
  become: true
  become_user: "{{ b_user }}"
  shell: |
    set timeout $env(ORACLE_ROOT_WRAPPER_TIMEOUT)
    spawn $env(ORACLE_ROOT_WRAPPER)

    expect "*Enter your Selection*"
    
    send "1\r"

    expect "*Enter your Selection*"

    send "1\r"

    expect "*Enter the PATH to root.sh*"

    send "$env(ROOTPRE_DIR)\r"

    expect "*Press ENTER to continue...*"

    send "\r"

    expect "*Enter your Selection*"

    send "x\r"
    
    exit 0
  args:
    executable: "{{ oracle_common_expect_path }}"
  environment:
    ROOTPRE_DIR: "{{ root_pre_folder }}"
    ORACLE_ROOT_WRAPPER: "{{ oracle_common_root_wrapper_path }}"
    ORACLE_ROOT_WRAPPER_TIMEOUT: "{{ oracle_common_root_wrapper_timeout | int }}"
  register: rootpre_output

- debug:
    msg: "{{ rootpre_output }}"
