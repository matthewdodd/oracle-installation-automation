---
# AIX (oracle_common_run_rootpre): run <ORACLE_HOME>/clone/rootpre.sh as root before the installer.
# wrapper method: the root wrapper only runs <dir>/root.sh, so rootpre.sh is copied to clone/root.sh first
# (the original flow). become method: clone/rootpre.sh runs directly. tasks/root_script.yml verifies it.

- name: Copy rootpre.sh to root.sh for the root wrapper
  when: oracle_common_root_script_method == 'wrapper'
  become: true
  become_user: "{{ db_owner }}"
  ansible.builtin.copy:
    src: "{{ oracle_home }}/clone/rootpre.sh"
    dest: "{{ oracle_home }}/clone/root.sh"
    remote_src: true
    mode: "{{ oracle_database_install_role_modes.root_script_mode }}"

- name: Run rootpre.sh as root
  ansible.builtin.include_tasks: root_script.yml
  vars:
    __oracle_database_install_role_root_script_dir: "{{ oracle_home }}/clone"
    __oracle_database_install_role_root_script_name: rootpre.sh
    __oracle_database_install_role_root_script_success_regex: "{{ oracle_common_rootpre_success_regex }}"
