---
- name: Cleanup install files
  become: true
  become_user: "{{ b_user }}"
  ansible.builtin.file:
    path: "{{ install_folder_name }}"
    state: absent

- name: Remove {{ remote_script_directory }} - ansible
  ansible.builtin.file:
    path: "{{ remote_script_directory }}"
    state: absent
  ignore_errors: true

- name: Remove {{ remote_script_directory }}
  become: true
  become_user: "{{ db_owner }}"
  ansible.builtin.file:
    path: "{{ remote_script_directory }}"
    state: absent
  ignore_errors: true
