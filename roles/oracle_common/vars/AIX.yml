---
# IBM AIX (ansible_facts['system'] == 'AIX').
__oracle_common_artifact_platform: AIX
__oracle_common_bash_path: /usr/bin/bash
__oracle_common_expect_path: /usr/bin/expect
# Command that adds a member to a group; called as: <command> <member> <group>
__oracle_common_group_add_command: /usr/bin/chgrpmem -m +
# AIX runs <ORACLE_HOME>/clone/rootpre.sh through the root wrapper before the installer.
__oracle_common_run_rootpre: true
__oracle_common_package_manager: ""
__oracle_common_prereq_packages: []
# Central inventory pointer file (Oracle's oraInst.loc location on this platform).
__oracle_common_inventory_pointer_file: /etc/oraInst.loc
