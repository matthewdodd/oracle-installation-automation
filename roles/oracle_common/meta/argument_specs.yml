---
# Variable reference for the shared configuration. Defaults live in ../defaults/main.yml;
# tasks/preflight.yml applies the format checks that argument specs cannot express.
argument_specs:
  main:
    short_description: Load per-OS variables and validate all inputs before an Oracle install.
    description:
      - Loads platform specifics from vars/<system>.yml, <os_family>.yml, <distribution>.yml and
        <distribution>-<major>.yml (generic first, specific last).
      - Validates the job inputs and the environment configuration, reporting every problem at once.
      - Must run (import_role) before initialization_role and oracle_database_install_role.
      - Derived paths, overridable but not listed as options because their defaults are templates of
        the inputs below - remote_script_directory (<oracle_common_staging_base>/ora_ansible_scripts_<DATABASE_NAME>),
        remote_output_directory (<oracle_common_staging_base>/oracle_database_install_<DATABASE_NAME>),
        oracle_common_env_dir (<oracle_common_site_prefix>), oracle_common_env_file (<oracle_common_env_dir>/<DATABASE_NAME>.env)
        and oracle_common_patch_file_name_fallback (<AIX|LINUX>_jan<YY>.tar.gz, YY from the target's clock; used only while
        oracle_common_patch_file_name is empty).
      - Per-OS values (oracle_common_artifact_platform, oracle_common_bash_path, oracle_common_expect_path,
        oracle_common_group_add_command, oracle_common_run_rootpre, oracle_common_package_manager,
        oracle_common_prereq_packages) come from vars/<os>.yml and can be overridden per host or group; they are
        not listed as options because they are only known after the OS variables are loaded.
    options:
      target:
        type: str
        required: true
        description: Comma-separated list of target hosts (AAP survey / extra var).
      DATABASE_NAME:
        type: str
        required: true
        description: ORACLE_SID. Must fully match [A-Za-z][A-Za-z0-9_]{0,7} (whole value, no whitespace or trailing newline).
      db_owner:
        type: str
        required: true
        description: OS user that owns the Oracle software (POSIX user name).
      database_version:
        type: str
        required: true
        description:
          - Oracle release to install. Allowed values are the keys of oracle_common_artifactory_version_map
            (19.0.0.0, 12.2.0.1, 12.1.0.2 by default). There is no fallback; 12.x prints a desupport warning.
      mountpoint:
        type: str
        required: true
        description: Absolute base filesystem. ORACLE_BASE is <mountpoint>/<db_owner>.
      oracle_common_artifactory_url:
        type: str
        required: true
        description:
          - http(s) URL of the repository folder holding one sub-folder per Oracle release,
            e.g. https://artifactory.example.com/artifactory/release/oracledatabase.
          - Do not embed credentials; use oracle_common_artifactory_username/password.
      oracle_common_site_prefix:
        type: str
        required: true
        description: Absolute site directory for <DB>.env files and software staging (<prefix>/software/<version>).
      oracle_common_root_wrapper_path:
        type: str
        required: true
        description: Absolute path of the privileged wrapper that runs root.sh / rootpre.sh.
      oracle_common_group_name:
        type: str
        description:
          - OS group db_owner and b_user are added to. Required while oracle_common_manage_group_membership is true.
          - Defaults to GROUP_NAME, the original input name, which keeps working.
      GROUP_NAME:
        type: str
        description: Original name of oracle_common_group_name, still accepted.
      oracle_common_manage_group_membership:
        type: bool
        default: true
        description: Add db_owner and b_user to oracle_common_group_name.
      b_user:
        type: str
        default: root
        description: Privileged account used through become for root-level work.
      oracle_common_staging_base:
        type: str
        default: /tmp
        description: Base directory for the per-database staging directories.
      script_permission:
        type: str
        default: "0777"
        description: Mode of the staged scripts and directories (tightened in resolution plan step 15).
      oracle_common_artifactory_version_map:
        type: dict
        description: Map of database_version to repository folder name; also the database_version allow-list.
      oracle_common_desupported_versions:
        type: list
        elements: str
        description: Versions that are accepted with a desupport warning.
      oracle_common_artifactory_username:
        type: str
        default: ""
        description: Repository user (secret; from Ansible Vault or an AAP credential). Basic auth is forced only when set.
      oracle_common_artifactory_password:
        type: str
        default: ""
        no_log: true
        description: Repository password or token (secret; from Ansible Vault or an AAP credential).
      oracle_common_artifactory_use_proxy:
        type: bool
        default: false
        description: Download through oracle_common_https_proxy.
      oracle_common_artifactory_validate_certs:
        type: bool
        default: true
        description: Verify the repository TLS certificate.
      oracle_common_artifactory_ca_path:
        type: str
        default: ""
        description: Optional PEM CA bundle on the target host used to verify the repository (exported as SSL_CERT_FILE).
      oracle_common_patch_file_name:
        type: str
        default: ""
        description:
          - Patch bundle file name in the repository, e.g. LINUX_jan26.tar.gz.
          - Empty falls back to <AIX|LINUX>_jan<YY>.tar.gz for the current year on the target (with a warning).
      oracle_common_https_proxy:
        type: str
        default: ""
        description: Optional HTTPS proxy URL. Empty sets no proxy variables.
      oracle_common_root_wrapper_timeout:
        type: int
        default: 300
        description: Seconds the expect dialogue waits for each root wrapper prompt.
      oracle_common_notification_webhook_url:
        type: str
        no_log: true
        description: Teams Workflows webhook URL (secret). Empty disables notifications. Alias notification_webhook_url.
      oracle_common_job_url_base:
        type: str
        default: ""
        description: Base of the AAP job link, e.g. https://aap.example.com/#/jobs/playbook/ (the job id is appended).
      oracle_common_notification_delegate_to:
        type: str
        default: ""
        description: Host that sends the card. Empty means each target host sends its own.
      oracle_common_notification_validate_certs:
        type: bool
        default: true
        description: Verify the webhook endpoint TLS certificate.
      oracle_common_notification_ca_path:
        type: str
        default: ""
        description: Optional PEM CA bundle used to verify the webhook endpoint.
      oracle_common_notification_timeout:
        type: int
        default: 30
        description: Webhook request timeout in seconds.
      oracle_common_notification_colours:
        type: dict
        description: Adaptive Card colour per state (keys start, success, fail).
      oracle_common_supported_systems:
        type: list
        elements: str
        description: Kernel names (ansible_facts['system']) that are supported; each needs vars/<system>.yml.
  notify:
    short_description: Send a best-effort Teams Workflows card for the job state.
    description:
      - Skipped when oracle_common_notification_webhook_url is empty. Never fails the run.
    options:
      call:
        type: str
        required: true
        description: Job state, start | success | fail (any other value is treated as fail).
