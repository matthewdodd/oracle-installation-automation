---
# Platform specifics live in ../vars/<name>.yml. Every file that exists is loaded, from the most
# generic to the most specific, so a later file overrides an earlier one:
#   <system>.yml (Linux, AIX)  ->  <os_family>.yml (RedHat)  ->  <distribution>.yml (RedHat, OracleLinux)
#   ->  <os_family>-<major>.yml (RedHat-9)  ->  <distribution>-<major>.yml (OracleLinux-9)
# The <os_family>-<major> layer gives every rebuild of a release (RHEL, Oracle Linux, Rocky, Alma) the
# same release file (e.g. the RedHat-9.yml package list) unless a <distribution>-<major>.yml overrides it.
# Supporting another distribution or release means adding one file; no task changes.
- name: Check the target OS is supported
  ansible.builtin.assert:
    that:
      - ansible_facts['system'] is defined
      - ansible_facts['system'] in oracle_common_supported_systems
      - (role_path ~ '/vars/' ~ ansible_facts['system'] ~ '.yml') is file
    fail_msg: >-
      Failed: OS not supported ({{ ansible_facts['system'] | default('unknown: facts were not gathered') }}).
      Supported: {{ oracle_common_supported_systems | join(', ') }}, each with a vars/<system>.yml file in the oracle_common role.
    quiet: true

# Without this check an EL7 host would run with an empty prerequisite list (there is no RedHat-7.yml) and
# skip the package check. The release must be a whole number at least __oracle_common_redhat_min_major_version
# (vars/main.yml); AIX and other Linux distributions are not affected.
- name: Check the Red Hat family release is supported
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution_major_version'] | default('') | string is match('\\A[0-9]+\\Z')
      - ansible_facts['distribution_major_version'] | int >= __oracle_common_redhat_min_major_version | int
    fail_msg: >-
      Failed: {{ ansible_facts['distribution'] | default('Red Hat family') }}
      {{ ansible_facts['distribution_major_version'] | default('(unknown release)') }} is not supported.
      EL7 (RHEL 7, Oracle Linux 7 and rebuilds) is no longer supported since this release: ansible-core 2.22
      needs Python 3.9 or later on the target. Supported Red Hat family releases: {{ __oracle_common_redhat_min_major_version }}
      and later. See "Supported platforms and Oracle versions" in README.md.
    quiet: true
  when: ansible_facts['os_family'] | default('') == 'RedHat'

- name: Load OS-specific variables (generic first, most specific last)
  ansible.builtin.include_vars:
    file: "{{ item }}"
  loop: "{{ __oracle_common_os_var_files }}"
  vars:
    __oracle_common_os_var_names:
      - "{{ ansible_facts['system'] }}"
      - "{{ ansible_facts['os_family'] | default('') }}"
      - "{{ ansible_facts['distribution'] | default('') }}"
      - "{{ ansible_facts['os_family'] | default('') }}-{{ ansible_facts['distribution_major_version'] | default('') }}"
      - "{{ ansible_facts['distribution'] | default('') }}-{{ ansible_facts['distribution_major_version'] | default('') }}"
    __oracle_common_os_var_files: >-
      {{ __oracle_common_os_var_names | reject('equalto', '') | reject('match', '\\A-|-\\Z') | unique
         | map('regex_replace', '^(.*)$', role_path ~ '/vars/\1.yml') | select('file') | list }}
