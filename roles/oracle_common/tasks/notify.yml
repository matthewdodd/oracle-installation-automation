---
# Sends a Microsoft Teams card through a Teams Workflows webhook ("When a Teams webhook request
# is received" -> post card) for the job state in `call`: start | success | anything else = fail.
# Best effort: skipped when oracle_common_notification_webhook_url is empty, and a failure to send
# is reported as a WARNING but never fails the run. The webhook URL is a secret (Vault / AAP
# credential), so the post runs with no_log.
- name: Send Installation Card
  when: oracle_common_notification_webhook_url | default('') | length > 0
  block:
    - name: Build notification facts
      ansible.builtin.set_fact:
        __oracle_common_notify_runner: "{{ tower_user_name | default(awx_user_name | default('scheduler')) }}"
        __oracle_common_notify_schedule: "{{ tower_schedule_name | default(awx_schedule_name | default('manual job')) }}"
        __oracle_common_notify_job_id: "{{ tower_job_id | default(awx_job_id | default('n/a')) }}"
        __oracle_common_notify_job_name: "{{ tower_job_template_name | default(awx_job_template_name | default('manual run')) }}"
        __oracle_common_notify_state: "{{ 'started' if call == 'start' else ('completed' if call == 'success' else 'failed') }}"
        __oracle_common_notify_colour: >-
          {{ (oracle_common_notification_colours | default({}, true)).get(call if call in ['start', 'success'] else 'fail', 'Default') }}

    - name: Build notification job URL
      ansible.builtin.set_fact:
        __oracle_common_notify_job_url: >-
          {{ (oracle_common_job_url_base ~ __oracle_common_notify_job_id)
             if (oracle_common_job_url_base | length > 0 and __oracle_common_notify_job_id | string != 'n/a') else 'n/a' }}

    - name: Send Installation Card
      ansible.builtin.uri:
        url: "{{ oracle_common_notification_webhook_url }}"
        method: POST
        body_format: json
        body:
          type: message
          attachments:
            - contentType: application/vnd.microsoft.card.adaptive
              contentUrl: null
              content:
                $schema: http://adaptivecards.io/schemas/adaptive-card.json
                type: AdaptiveCard
                version: "1.4"
                msteams:
                  width: Full
                body:
                  - type: TextBlock
                    text: "Job #{{ __oracle_common_notify_job_id }} '{{ __oracle_common_notify_job_name }}'"
                    size: Medium
                    weight: Bolder
                    wrap: true
                  - type: TextBlock
                    text: "Database Binaries for '{{ DATABASE_NAME | default('n/a') }}' installation"
                    isSubtle: true
                    spacing: None
                    wrap: true
                  - type: TextBlock
                    text: "Database binary installation has {{ __oracle_common_notify_state }}"
                    color: "{{ __oracle_common_notify_colour }}"
                    weight: Bolder
                    wrap: true
                  - type: FactSet
                    facts:
                      - title: Database
                        value: "{{ DATABASE_NAME | default('n/a') }}"
                      - title: Host
                        value: "{{ target | default(inventory_hostname) }}"
                      - title: Job URL
                        value: "{{ __oracle_common_notify_job_url }}"
                      - title: Running User
                        value: "{{ __oracle_common_notify_runner }}"
                      - title: Scheduled Job Name
                        value: "{{ __oracle_common_notify_schedule }}"
                actions: >-
                  {{ [{'type': 'Action.OpenUrl', 'title': 'View job', 'url': __oracle_common_notify_job_url}]
                     if __oracle_common_notify_job_url != 'n/a' else [] }}
        status_code: [200, 201, 202, 204]
        timeout: "{{ oracle_common_notification_timeout }}"
        validate_certs: "{{ oracle_common_notification_validate_certs }}"
        ca_path: "{{ oracle_common_notification_ca_path if oracle_common_notification_ca_path | length > 0 else omit }}"
      environment: >-
        {{ {'https_proxy': oracle_common_https_proxy, 'HTTPS_PROXY': oracle_common_https_proxy}
           if oracle_common_https_proxy | length > 0 else {} }}
      delegate_to: "{{ oracle_common_notification_delegate_to if oracle_common_notification_delegate_to | length > 0 else inventory_hostname }}"
      ignore_unreachable: true
      no_log: true
      register: __oracle_common_notify_result
      failed_when: false
      changed_when: false

    - name: Report notification failure (non-fatal)
      ansible.builtin.debug:
        msg: >-
          WARNING: '{{ __oracle_common_notify_state | default(call) }}' notification was not sent
          (HTTP {{ __oracle_common_notify_result.status | default('n/a') }}):
          {{ (__oracle_common_notify_result.msg | default('unknown error') | string)
             | replace(oracle_common_notification_webhook_url, '<webhook URL>') }}
      when: (__oracle_common_notify_result.status | default(-1) | int) not in [200, 201, 202, 204]
  rescue:
    - name: Report notification failure (non-fatal)
      ansible.builtin.debug:
        msg: "WARNING: '{{ call | default('unknown') }}' notification was not sent (details hidden: the request carries a secret)"
