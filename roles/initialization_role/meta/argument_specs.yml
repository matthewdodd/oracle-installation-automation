---
# Inputs of this role. Defaults and per-OS values come from roles/oracle_common, which must run first.
argument_specs:
  main:
    short_description: Prepare a host for an Oracle install (staging directories, OS group membership).
    description:
      - Removes and recreates the per-database staging directories as db_owner (never through a symlink) and verifies they
        are owned by db_owner and not group/world-writable.
      - Adds db_owner and b_user to oracle_common_group_name (alias GROUP_NAME) when oracle_common_manage_group_membership is
        true. Membership is checked exactly (getent group / lsgroup); the change runs through become, not inline sudo.
    options:
      DATABASE_NAME:
        type: str
        required: true
        description: ORACLE_SID; part of the staging directory names.
      db_owner:
        type: str
        required: true
        description: OS user that owns the Oracle software.
      oracle_common_privileged_user:
        type: str
        description: Privileged account (default b_user, else root; from oracle_common); added to the group.
      b_user:
        type: str
        description: Original name of oracle_common_privileged_user, still accepted.
      oracle_common_group_name:
        type: str
        description: OS group to join (defaults to GROUP_NAME). Required while oracle_common_manage_group_membership is true.
      GROUP_NAME:
        type: str
        description: Original name of oracle_common_group_name, still accepted.
      oracle_common_manage_group_membership:
        type: bool
        description: Manage membership of oracle_common_group_name (default true, from oracle_common).
      oracle_common_group_membership_become_user:
        type: str
        description: Account that runs the group change through become (default root, from oracle_common).
      oracle_common_staging_base:
        type: str
        description: Base of the staging directories (default <mountpoint>/<db_owner>/ansible_staging, from oracle_common).
      oracle_common_staging_dir_mode:
        type: str
        description: Mode of the staging directories (default 0750, from oracle_common).
      oracle_common_script_permission:
        type: str
        description: Mode of the staged scripts (default script_permission, else 0750; from oracle_common).
      script_permission:
        type: str
        description: Original name of oracle_common_script_permission, still accepted.
