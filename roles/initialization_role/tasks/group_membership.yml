---
- name: Set the member and group to manage
  ansible.builtin.set_fact:
    memberlist: "{{ item }}"
    groupname: "{{ oracle_common_group_name }}"

# The OS gate (Linux / AIX only) is enforced by roles/oracle_common/tasks/os_vars.yml, which
# also supplies the per-OS shell and group command (vars/<os>.yml).
- name: Add member to group
  shell:
  args:
    executable: "{{ oracle_common_bash_path }}"
    cmd: |
      membername={{memberlist}}
      grep {{groupname}}: /etc/group | grep $membername
        
      if [ $? -eq 0 ]
      then
        echo "Member $membername is already in the {{groupname}} group."
      else
        echo "add $membername" "{{groupname}}"
        sudo {{ oracle_common_group_add_command }} "$membername" "{{groupname}}"
      fi
      if [ $? -ne 0 ]
      then
        echo "Error adding $membername to {{groupname}}"
        exit 1
      fi
  register: action_result

- debug:
    msg: "{{action_result.stdout_lines}}"