---
- name: Init Clean
  block:
    - name: Init Clean
      ansible.builtin.include_tasks: init_clean.yml
  ignore_errors: yes

- name: Add member to group
  block:
    - name: Add member to group
      ansible.builtin.include_tasks: group_membership.yml
      loop:
        - "{{ db_owner }}"

- name: Run init
  become: yes
  become_user: "{{ db_owner }}"
  block:
    - name: Create {{ remote_script_directory }}
      ansible.builtin.file:
        path: "{{ remote_script_directory }}"
        state: directory
        mode: "{{ script_permission }}"

    - name: Create {{ remote_output_directory }}
      ansible.builtin.file:
        path: "{{ remote_output_directory }}"
        state: directory
        mode: "{{ script_permission }}"

- name: Add member to group
  block:
    - name: Add member to group
      ansible.builtin.include_tasks: group_membership.yml
      loop:
        - "{{ b_user }}"
