---
# remote_script_directory / remote_output_directory come from ../defaults/main.yml
- name: Remove {{ remote_script_directory }} if exists
  block:
    - name: Remove {{ remote_script_directory }} if exists - ANSIBLE
      ansible.builtin.file:
        path: "{{ remote_script_directory }}"
        state: absent
  rescue:
    - name: Remove {{ remote_script_directory }} if exists - {{ db_owner }}
      become: yes
      become_user: "{{ db_owner }}"
      ansible.builtin.file:
        path: "{{ remote_script_directory }}"
        state: absent

- name: Remove {{ remote_output_directory }} if exists
  block:
    - name: Remove {{ remote_output_directory }} if exists - ANSIBLE
      ansible.builtin.file:
        path: "{{ remote_output_directory }}"
        state: absent
  rescue:
    - name: Remove {{ remote_output_directory }} if exists - {{ db_owner }}
      become: yes
      become_user: "{{ db_owner }}"
      ansible.builtin.file:
        path: "{{ remote_output_directory }}"
        state: absent
