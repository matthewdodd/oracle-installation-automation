---
- name: Add server names passed in to the Playbook
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Check that target was supplied
      ansible.builtin.assert:
        that:
          - target is defined
          - target | string | trim | length > 0
        fail_msg: >-
          target is required: pass the comma-separated host list, e.g. -e target=dbhost01.example.com
          (AAP: the 'target' survey question / extra var).
        quiet: true

    - name: Add server names to the Ansible inventory
      when: target is defined
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: "{{ ansible_inventory_groups | default(omit) }}"
      loop: "{{ target.replace(',', ' ').split() }}"
      changed_when: false

- name: Database Binary installation Playbook - Tasks
  # The default only keeps the play parseable when target is missing; play 1 fails first with a clear message.
  hosts: "{{ target | default('') }}"
  tasks:
    - name: Send Starting Notification
      ansible.builtin.include_tasks: notification.yml
      vars:
        call: "start"

    # Every stage ends a failure the same way (roles/oracle_common/tasks/failure_report.yml): a failure
    # notification (best effort, never fatal) and a failed host whose message names the failed task and
    # its error. The install stage first records the failure, then rolls back and cleans up.
    - name: Initialize
      block:
        # Shared configuration: per-OS variables and validation of every input (roles/oracle_common).
        - name: Load platform variables and validate inputs
          ansible.builtin.import_role:
            name: oracle_common

        # Read-only production-host safety checks, before anything is changed on the host: refuse an
        # existing non-empty ORACLE_HOME or a different <DB>.env (unless forced) and decide whether the
        # central inventory is reused (side-by-side) or created (clean target).
        - name: Check the host is safe to install on
          ansible.builtin.include_role:
            name: oracle_database_install_role
            tasks_from: preflight

        - name: Initialize
          ansible.builtin.import_role:
            name: initialization_role
      rescue:
        - name: Report the failed Initialize stage
          ansible.builtin.include_role:
            name: oracle_common
            tasks_from: failure_report
          vars:
            oracle_common_failure_stage: Initialize

    # On main this step was outside any block, so its failure sent no notification.
    - name: Pre-Cleanup the Oracle Database install
      block:
        - name: Pre-Cleanup the Oracle Database install
          ansible.builtin.include_role:
            name: oracle_database_install_role
            tasks_from: clean_files_from_server
      rescue:
        - name: Report the failed Pre-Cleanup stage
          ansible.builtin.include_role:
            name: oracle_common
            tasks_from: failure_report
          vars:
            oracle_common_failure_stage: Pre-Cleanup

    - name: Install the Oracle Database Binaries
      block:
        - name: Install the Oracle Database Binaries
          ansible.builtin.import_role:
            name: oracle_database_install_role
      rescue:
        # Recorded first: the rollback and cleanup below have rescues of their own that would replace
        # ansible_failed_task / ansible_failed_result.
        - name: Record the failed Install stage
          ansible.builtin.include_role:
            name: oracle_common
            tasks_from: failure_record
          vars:
            oracle_common_failure_stage: Install
        # Removes only what this run created (ORACLE_HOME, <DB>.env, central inventory); never pre-existing ones.
        - name: Roll back the failed Oracle Database install
          ansible.builtin.include_role:
            name: oracle_database_install_role
            tasks_from: rollback
        - name: Cleanup the Oracle Database install
          ansible.builtin.include_role:
            name: oracle_database_install_role
            tasks_from: clean_files_from_server
        - name: Report the failed Install stage
          ansible.builtin.include_role:
            name: oracle_common
            tasks_from: failure_report
          vars:
            oracle_common_failure_stage: Install

    - name: Cleanup the Oracle Database install
      block:
        - name: Cleanup the Oracle Database install
          ansible.builtin.include_role:
            name: oracle_database_install_role
            tasks_from: clean_files_from_server
      rescue:
        - name: Report the failed Cleanup stage
          ansible.builtin.include_role:
            name: oracle_common
            tasks_from: failure_report
          vars:
            oracle_common_failure_stage: Cleanup

    - name: Send Success Notification
      ansible.builtin.include_tasks: notification.yml
      vars:
        call: "success"
